[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionzero"
version = "0.1.0"
description = "Controle de l'ordinateur par gestes de la main (webcam)"
requires-python = ">=3.12"
dependencies = ["mediapipe==1.2.2", "opencv-python==5.0.0.93", "numpy==2.5.4", "PySide6==6.11.3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
motionzero = "motionzero.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
